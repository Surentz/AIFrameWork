services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: aiframework_e2e
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U e2e -d aiframework_e2e']
      interval: 2s
      timeout: 3s
      retries: 30
