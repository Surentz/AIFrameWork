server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: without this, a browser refresh on /orders asks nginx for a file
    # that does not exist and gets a 404 instead of the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are immutable; index.html must never be cached or a deploy is
    # invisible until the browser happens to revalidate.
    # One add_header, not `expires` plus one: `expires` emits its own Cache-Control, and nginx
    # appends rather than merges, so the pair sends two Cache-Control headers and leaves which
    # one wins up to the client.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
