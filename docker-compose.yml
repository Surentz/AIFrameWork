# Development database. The e2e stack lives in docker-compose.e2e.yml and runs on its own
# port; the two are meant to be up at the same time, so this file sets an explicit project
# name to avoid a container-name collision with it.
name: aiframework-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aiframework
    ports:
      - '${DEV_PG_PORT:-55433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d aiframework']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      # Named, unlike the e2e stack's throwaway container: dev data survives a `down`.
      - pgdata:/var/lib/postgresql/data

  # Dev-only structured log UI, for the centralized logging framework
  # (docs/superpowers/plans/2026-09-13-centralized-logging.md). Behind a profile so a bare
  # `docker compose up` — what dev.ps1 runs by default — never starts it: a developer who has
  # not asked for it should not pay for a second container, and `Observability:Otlp:Enabled`
  # defaults to false everywhere anyway (appsettings.json), so nothing tries to export to it
  # until dev.ps1 -WithSeq turns both on together. Start by hand with
  # `docker compose --profile observability up -d seq`, or via that switch.
  #
  # `docker compose down` with no --profile flag will NOT stop this container once started —
  # confirmed empirically, not assumed: compose's `down` only tears down the active profile set
  # for THAT invocation, not whatever an earlier `up` left running. Stop it with
  # `docker compose --profile observability down`, which scripts/stop-dev.ps1 always passes
  # (harmless when Seq was never started — there is then nothing in that profile to stop).
  seq:
    image: datalust/seq:2026.1
    profiles: ['observability']
    environment:
      ACCEPT_EULA: 'Y'
      # No authentication, on purpose: a localhost-only container that is never deployed, the
      # same judgement already applied to the dev Postgres password above and to
      # docker-compose.e2e.yml's throwaway credentials. Confirmed empirically while wiring this
      # up (see ObservabilityRegistration.BuildOtlpEndpoint's remarks) that Seq needs
      # SEQ_FIRSTRUN_NOAUTHENTICATION or SEQ_FIRSTRUN_ADMINPASSWORD set at all — with neither,
      # the container exits immediately rather than starting unauthenticated.
      SEQ_FIRSTRUN_NOAUTHENTICATION: 'True'
    ports:
      # Port 80 in the container serves the UI, the query API, AND OTLP ingestion — all three
      # over plain HTTP, nothing else to map. ObservabilityRegistration builds the ingest URL as
      # "<this>/ingest/otlp" + "/v1/logs" or "/v1/traces"; confirmed against a live container,
      # not assumed — see BuildOtlpEndpoint's remarks for why that distinction mattered here.
      - '${SEQ_PORT:-55341}:80'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      # Named, like pgdata above: dev logs survive a `down`, and disposable — a
      # `docker compose --profile observability down -v` (or deleting the volume by hand) is the
      # reset, same as pgdata.
      - seqdata:/data

  # The SignalR backplane. Behind the same `realtime` profile as nothing else, so an ordinary
  # `docker compose up` is unchanged and a developer who never touches notifications pays for no
  # extra container — the same posture the `observability` profile takes for Seq.
  #
  # Worth knowing what this is NOT for locally: `dotnet run` is a single process, so push works
  # without any backplane at all. This exists so the multi-replica path can be rehearsed on a
  # laptop, and because the k8s overlay needs the same image. See ADR 0016.
  redis:
    image: redis:8-alpine
    profiles: ['realtime']
    ports:
      - '${REDIS_PORT:-55379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
    # No volume, deliberately. A backplane holds messages in flight, not state worth keeping:
    # everything it carries is already committed in Postgres, and a restart that loses the queue
    # costs at most a few live updates that clients pick up on their next read.

volumes:
  pgdata:
  seqdata:
