# Throwaway credentials for a localhost-only kind cluster that is never deployed anywhere.
# Committed deliberately, the same judgement already applied to `docker-compose.e2e.yml` and to
# the dev connection string in `src/Api/appsettings.Development.json`: the cluster is reachable
# only from this machine and holds nothing real. This is a bounded exception to the repository's
# no-secrets rule, not a pattern — never reuse these values, and never copy this file into an
# overlay that targets a real environment, where the Secret belongs in a sealed-secrets or
# external-secrets flow instead.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres
  # Timeout=5 caps a single connection ATTEMPT, distinct from EnableRetryOnFailure's
  # maxRetryDelay (the pause BETWEEN attempts). Without it, Npgsql's 15s default means one
  # stalled attempt against a blackholed network path can sit for 15s and three retries for
  # three times that - no readiness-probe timeoutSeconds bounds that case, only this does.
  # See k8s/base/api.yaml's readinessProbe and ADR 0014.
  ConnectionStrings__Default: 'Host=postgres;Port=5432;Database=aiframework;Username=postgres;Password=postgres;Timeout=5'
