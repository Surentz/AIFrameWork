# Throwaway credentials for a localhost-only kind cluster that is never deployed anywhere.
# Committed deliberately, the same judgement already applied to `docker-compose.e2e.yml` and to
# the dev connection string in `src/Api/appsettings.Development.json`: the cluster is reachable
# only from this machine and holds nothing real. This is a bounded exception to the repository's
# no-secrets rule, not a pattern — never reuse these values, and never copy this file into an
# overlay that targets a real environment, where the Secret belongs in a sealed-secrets or
# external-secrets flow instead.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres
  ConnectionStrings__Default: 'Host=postgres;Port=5432;Database=aiframework;Username=postgres;Password=postgres'
