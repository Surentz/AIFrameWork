# Throwaway self-signed certificate for `aiframework.localtest.me`, which resolves to 127.0.0.1
# publicly, so this key can only ever protect traffic that never leaves the machine. The private
# key is committed on purpose, the same judgement already applied to `docker-compose.e2e.yml`
# and to the dev connection string in `src/Api/appsettings.Development.json` — a bounded
# exception, not a pattern. Never reuse this key, and never copy this file into an overlay that
# targets a real environment; there the certificate comes from cert-manager or the platform.
#
# Valid 2026-09-10 to 2027-09-10. To regenerate when it expires:
#
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout tls.key -out tls.crt \
#     -subj "/CN=aiframework.localtest.me" \
#     -addext "subjectAltName=DNS:aiframework.localtest.me"
#   kubectl create secret tls aiframework-tls --cert=tls.crt --key=tls.key \
#     --dry-run=client -o yaml
#
# The namespace is deliberately absent: the overlay kustomization's namespace transformer
# supplies it, as it does for every sibling resource.
apiVersion: v1
data:
  tls.crt: 
  tls.key: 
kind: Secret
metadata:
  name: aiframework-tls
type: kubernetes.io/tls
