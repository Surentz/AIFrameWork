apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # Production is deliberate. It is also why Task 9's ingress must terminate TLS:
  # Production sets CookieSecurePolicy.Always, and over plain HTTP the browser discards
  # the session cookie silently.
  ASPNETCORE_ENVIRONMENT: 'Production'
  # Note the DOUBLE underscore. A single one binds nothing and warns nothing.
  Cache__Enabled: 'true'
  Wolverine__Durable: 'true'
  RateLimiting__Auth__PermitLimit: '10'
  RateLimiting__Auth__WindowSeconds: '60'
  # Note the DOUBLE underscore, like every key here. Safe in this overlay specifically: the
  # ingress is the only route to the api Service, so X-Forwarded-For cannot be attacker-chosen.
  # Do not copy this into an overlay whose API is reachable directly - see ADR 0012.
  ForwardedHeaders__Enabled: 'true'
  # The e2e suite's operator. Writing to the catalogue needs Catalogue.Manage (ADR 0025), so most
  # of the kind run arranges its products as this account; the name is fixed in
  # frontend/e2e/support/identity.ts because configuration is the only grant (ADR 0020).
  # A SECURITY-RELEVANT line, and safe only here: whoever registers this name first on a cluster
  # becomes its administrator. That is acceptable on a throwaway localhost cluster the e2e run
  # itself seeds; never copy it into an overlay other people can reach. DOUBLE underscores, and
  # the index is the list position.
  Admin__Usernames__0: 'e2e-admin'
  # Realtime notification push, and the backplane that makes it correct above one replica.
  # DOUBLE underscores, like every key here. The Redis host is the in-cluster Service name from
  # k8s/base/redis.yaml. See ADR 0019.
  Realtime__Enabled: 'true'
  Realtime__RedisConnectionString: 'redis:6379'
  # The external systems pilot (ADR 0031): Statistics Denmark's StatBank, a public API with no
  # certificate and no token, so it needs no Secret volume. The api and the worker both read this
  # ConfigMap, which keeps their two copies identical. The cluster needs outbound internet; without
  # it the system reads Unhealthy on /monitoring/integrations and the population page says so.
  ExternalSystems__Systems__StatisticsDenmark__BaseAddress: 'https://api.statbank.dk/v1/'
  ExternalSystems__Systems__StatisticsDenmark__Probe__Path: 'subjects'
