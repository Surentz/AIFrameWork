apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  # Two replicas is the point of the exercise: it is what makes the data protection key ring
  # and the ingress session affinity load-bearing rather than decorative.
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # 60s against the host's 30s shutdown timeout. The Kubernetes default is also 30s, so a
      # host using its full budget would be SIGKILLed exactly at the boundary — and the outbox
      # increments Attempts at claim time, so a kill mid-handler burns an attempt against
      # MaxAttempts.
      terminationGracePeriodSeconds: 60
      # Put the replicas on different nodes, so two replicas is two failure domains rather than
      # two processes sharing one kubelet, one page cache and one power cord. This is what makes
      # the PodDisruptionBudget in autoscaling.yaml mean anything: a budget that keeps one pod
      # alive is no protection if both pods are on the node being drained.
      #
      # DoNotSchedule rather than ScheduleAnyway: a soft preference would silently degrade to
      # co-located pods under the smallest scheduling pressure, which is exactly the state this
      # is meant to prevent and exactly the state nobody would notice. It stays satisfiable as
      # the HPA scales - with maxSkew 1 across the cluster's nodes, 6 replicas spread evenly
      # rather than pending.
      #
      # Two settings make it survive a rolling update, and both were found by one hanging:
      #  - nodeTaintsPolicy: Honor. By default a spread counts TAINTED nodes as domains, so kind's
      #    control plane - which no api pod may run on - sat in the count with zero pods. With one
      #    replica per worker, the rollout's surge pod would make a worker hold 2 against that 0, a
      #    skew of 2, so DoNotSchedule left it Pending and `kubectl rollout status` timed out:
      #    every deploy.ps1 run after the first hung at "Rolling out the application".
      #  - matchLabelKeys: [pod-template-hash]. Count only pods of the same revision. Otherwise the
      #    old ReplicaSet's pods are counted while the new ones are placed, and a finished rollout
      #    can leave both new replicas on one node - observed - which is the state this exists to
      #    prevent, and nothing re-spreads running pods.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: api
      containers:
        - name: api
          image: aiframework-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          lifecycle:
            preStop:
              # Leave the Service endpoints before we stop accepting connections. Without this,
              # in-flight requests are refused during a rolling update while endpoint removal
              # propagates. Uses the native sleep hook (GA since v1.30) rather than an exec
              # command because the chiseled base image has no shell.
              sleep:
                seconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            # Generous: durable Wolverine does schema work at boot, and a slow start must not
            # read as a crash loop.
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 10
            # Explicit, where the other two probes accept Kubernetes' 1s default. This one now
            # calls AddDbContextCheck's CanConnectAsync, which goes through the
            # EnableRetryOnFailure execution strategy like every other database access, so a
            # down Postgres no longer fails this probe on the FIRST attempt - it fails after up
            # to three retries. In this cluster that is fast: a Postgres Service with no ready
            # endpoints refuses the connection near-instantly, so three retries plus up to 1s of
            # backoff between them comfortably fits inside 5s. The pathological case - a
            # network path that blackholes rather than refuses - is bounded separately by the
            # connection string's own Timeout=5, not by this value; without it, a single stalled
            # attempt could sit for Npgsql's 15s default and three would sit for three times
            # that, which no probe timeout here would paper over. ADR 0014.
            timeoutSeconds: 5
          # A memory limit but deliberately no CPU limit. Memory is the one the kubelet cannot
          # reclaim gracefully, so a ceiling turns a leak into a restart instead of an evicted
          # neighbour. A CPU limit, by contrast, throttles: the request already guarantees a
          # share under contention, and capping on top of it would only add latency at startup
          # and under burst, where this workload is at its spikiest.
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            # Safe because nothing in the running API writes to disk: the Data Protection key
            # ring is in Postgres (ADR 0010), and a Release build loads the Wolverine adapters
            # committed under src/Api/Internal/Generated rather than compiling any at startup.
            # A Debug image would need a writable path for that codegen; this one does not.
            readOnlyRootFilesystem: true
            # Both images already set a non-root USER, so this changes nothing at runtime. It
            # makes the guarantee enforced rather than incidental: an image edit that drops
            # USER fails the pod loudly instead of quietly running as root.
            runAsNonRoot: true
            capabilities:
              drop: ['ALL']
