apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aiframework
resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - rabbitmq.yaml
  - migrate-job.yaml
  - api.yaml
  - worker.yaml
  - web.yaml
  - ingress.yaml
  # HorizontalPodAutoscalers and PodDisruptionBudgets. Last, because an HPA that is applied
  # before its scaleTargetRef exists reports a failure condition until its next sync.
  - autoscaling.yaml
