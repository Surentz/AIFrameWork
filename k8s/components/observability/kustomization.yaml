# A Kustomize Component, not a plain set of resources folded into an overlay - the whole point is
# that it is opt-in. k8s/overlays/local never references this; only
# k8s/overlays/local-observability does, via components: rather than resources:. A developer
# rehearsing the cookie-affinity behaviour of ADR 0010 should not pay for a log store to do it.
# See docs/superpowers/plans/2026-09-13-centralized-logging.md, Task 7.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - otel-collector.yaml
  - opensearch.yaml
  - opensearch-dashboards.yaml
  - ism-policy-job.yaml
  - dashboards-index-pattern-job.yaml
  - prometheus.yaml
  - grafana.yaml

# The dashboard as a real .json file rather than a string inside YAML, so it stays diffable and
# can be exported from Grafana and pasted back. disableNameSuffixHash keeps the ConfigMap name
# fixed for grafana.yaml's volume; Grafana re-reads the file on its own, no restart needed.
configMapGenerator:
  - name: grafana-dashboards
    files:
      - aiframework.json=grafana-dashboard.json
    options:
      disableNameSuffixHash: true
  # The alert rules, as the same file prometheus-rules.test.yml unit-tests with promtool. The
  # test file itself is not shipped.
  - name: prometheus-rules
    files:
      - prometheus-rules.yml
    options:
      disableNameSuffixHash: true

# Adds the two Otlp keys to the SAME app-config ConfigMap k8s/overlays/local/config.yaml already
# defines, rather than this component declaring its own ConfigMap - one ConfigMap, one envFrom on
# the api Deployment (k8s/base/api.yaml), unchanged. Left out of local/config.yaml itself so that
# overlay stays correct with no collector running: Observability:Otlp:Enabled defaults to false
# (appsettings.json) precisely so a missing collector means no export, not a crash, but there is
# no reason to carry a dead "true" here when this component is not included at all.
patches:
  - target:
      kind: ConfigMap
      name: app-config
    patch: |-
      - op: add
        path: /data/Observability__Otlp__Enabled
        value: 'true'
      - op: add
        path: /data/Observability__Otlp__Endpoint
        value: 'http://otel-collector.aiframework:4318'
      # The monitoring page's trace links: Discover over the otel-logs index pattern
      # (dashboards-index-pattern-job.yaml), filtered to the trace, last seven days - the ISM
      # retention. localhost:5601 because Dashboards is reached by the port-forward deploy.ps1
      # prints. Checked by loading it in a browser against a real sign-in row's trace id: Discover
      # showed exactly that request's log lines.
      - op: add
        path: /data/Monitoring__TraceLinkTemplate
        value: "http://localhost:5601/app/data-explorer/discover#?_a=(discover:(columns:!(_source),isDirty:!f,sort:!()),metadata:(indexPattern:otel-logs,view:discover))&_g=(filters:!(),refreshInterval:(pause:!t,value:0),time:(from:now-7d,to:now))&_q=(filters:!(),query:(language:kuery,query:'traceId:%22{traceId}%22'))"
