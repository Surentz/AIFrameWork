# Prometheus, as the cluster's metrics store and rule evaluator (ADR 0027). Metrics arrive PUSHED
# from the OTel Collector through Prometheus's native OTLP receiver - there is no scrape config and
# no application pod exposes a metrics port. Its config is prometheus.yml beside this file (see
# that file for why it is generated with a content hash). Storage is an emptyDir: this is a
# rehearsal cluster, and seven days of local metrics are not worth a PVC pinned to one node the
# way Postgres's is. History survives every deploy that leaves the config and rules alone.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-otlp-receiver
            # A counter series is born at its first increment - the first dead letter, the
            # first 5xx on a route - so its first sample is already 1, and rate()/increase()
            # never see the step from 0: the alert on "any dead letter" stayed silent for the
            # first one. This writes a 0 at the OTLP start timestamp, which is exactly that step.
            # Observed on this cluster before and after adding it.
            - --enable-feature=created-timestamp-zero-ingestion
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus-rules
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          emptyDir: {}
