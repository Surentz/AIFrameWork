kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: aiframework
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      # ingress-nginx's kind manifest schedules onto a node carrying this label.
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Host 80/443 are taken on this machine (IIS/BranchCache reserve them via http.sys), so
      # the ingress is exposed on 8080/8443 instead. Browse https://aiframework.localtest.me:8443.
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
