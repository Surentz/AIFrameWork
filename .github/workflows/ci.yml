# What /verify does locally, run on every push to main and every pull request.
#
# The one thing this adds beyond /verify is the Release dimension. Release was broken in this
# repo for the whole life of the Wolverine spike and nothing noticed, because `dotnet build`
# succeeded with zero warnings and only failed at *startup* — Wolverine ships without the Roslyn
# compiler in Release and needs pre-generated handler adapters (ADR 0005). A Debug-only CI would
# have stayed green through exactly that bug, so the backend job runs both configurations and a
# separate job proves the committed generated code is still current.
name: CI

on:
  # push is limited to main to save Actions minutes: a feature branch is checked through its PR
  # instead, so a push to a branch with an open PR no longer runs the whole pipeline twice. A
  # branch with no PR yet gets no CI until one is opened - run /verify locally before that.
  #
  # Docs-only changes skip CI entirely: nothing under docs/ and no Markdown file (CLAUDE.md,
  # skills, ADRs, READMEs) feeds the build, tests or generated artifacts. A change that touches
  # any other file still runs everything.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

# A newer push to the same branch makes the older run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned to CLAUDE.md's version table. There is no global.json, so the workflows are the only
  # thing holding CI to the SDK the repo documents — if that table changes, change this AND
  # e2e.yml's copy (a called workflow does not inherit this env).
  DOTNET_VERSION: '10.0.400'
  NODE_VERSION: '24.20.0'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  backend:
    # Both configurations, deliberately. See the note at the top of this file: Debug alone is
    # what let a non-booting Release sit in the repo unnoticed.
    name: backend (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    strategy:
      # Debug and Release fail for different reasons and both answers are wanted.
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # No packages.lock.json in this repo, so the key is the project files instead. Imperfect
      # (a floating version could resolve differently on a hit) but every version here is pinned.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore

      # Warnings are errors across compiler, analyzers and build (Directory.Build.props), so
      # this step failing on a warning is the intended behaviour, not a CI misconfiguration.
      - name: Build
        run: dotnet build -c ${{ matrix.configuration }} --no-restore

      # Testcontainers needs a Docker daemon; ubuntu-latest runners ship one already running,
      # which is why there is no service container or setup step here.
      - name: Test
        run: dotnet test -c ${{ matrix.configuration }} --no-build

  codegen:
    # The failure this job exists for is invisible everywhere else: generated code that no
    # longer matches its handlers still compiles (it is valid C# regardless) and still passes a
    # Debug run (Debug compiles adapters at startup). WolverineCodegenTests catches a *missing*
    # adapter; this catches one that merely drifted. `codegen write` is deterministic, so a
    # non-empty diff here means the committed output is genuinely out of date.
    name: generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore

      - run: dotnet build -c Debug --no-restore

      - name: Regenerate Wolverine handler adapters
        env:
          # codegen write boots the host. Wolverine__Durable=false keeps it in MediatorOnly, so
          # it never opens a connection, and the connection string only has to be non-empty to
          # get past the startup guard in Program.cs.
          ConnectionStrings__Default: 'Host=localhost;Database=placeholder;Username=placeholder;Password=placeholder'
          Wolverine__Durable: 'false'
        run: dotnet run --project src/Api --no-build -- codegen write

      - name: Fail if the committed generated code is stale
        run: |
          if ! git diff --exit-code -- src/Api/Internal; then
            echo "::error file=src/Api/Internal::Generated Wolverine code is out of date. Run 'dotnet run --project src/Api -- codegen write' and commit the result."
            exit 1
          fi

      # TWO generated trees, not one. Release resolves pre-built handler types out of
      # opts.ApplicationAssembly, and the worker's is its own — it cannot share the Api's,
      # because that would need a Worker -> Api reference the dependency rule forbids. A job
      # handler added without regenerating THIS tree leaves Debug green and breaks the worker at
      # startup in Release, which is the same trap the Api half of this job exists for. ADR 0016.
      - name: Regenerate the worker's Wolverine handler adapters
        env:
          ConnectionStrings__Default: 'Host=localhost;Database=placeholder;Username=placeholder;Password=placeholder'
          Wolverine__Durable: 'false'
        run: dotnet run --project src/Worker --no-build -- codegen write

      - name: Fail if the worker's committed generated code is stale
        run: |
          if ! git diff --exit-code -- src/Worker/Internal; then
            echo "::error file=src/Worker/Internal::Generated Wolverine code for the worker is out of date. Run 'dotnet run --project src/Worker -- codegen write' and commit the result."
            exit 1
          fi

  contract:
    # The same guard as the `codegen` job above, for the other pair of committed generated
    # artifacts. A contract change that regenerates neither leaves the React app compiling
    # against a shape the API no longer returns - which is the failure this whole feature
    # exists to make impossible.
    name: api contract is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: npm ci --prefix frontend

      # A separate step, not folded into the msbuild call below. `dotnet msbuild` does not
      # restore implicitly the way `dotnet build` does, and this job fails without it
      # (NETSDK1004, assets file not found). Nor can it be `-t:"Restore;Build;..."`: MSBuild
      # evaluates the project once, before Restore writes NuGet's props, so the OpenAPI XML
      # comment source generator then fails with CS9137 about interceptors. Restore first, in
      # its own invocation.
      - run: dotnet restore src/Api

      # ALL THREE variables are required, and each was proved by a red build rather than
      # reasoned out. The generator runs the application: without a connection string it dies on
      # Program.cs's startup guard ("ConnectionStrings:Default is not configured"); with one but
      # still durable, Wolverine's startup migration dials Postgres (ADR 0005); and with the
      # administrator reconcile on, AdminReconciler dials it too, failing the generator with an
      # ObjectDisposedException rather than anything that names the cause (ADR 0020). There is no
      # database in this job. The connection string is never opened - it only has to be non-empty,
      # and every startup path that would open it has to be switched off here.
      - name: Regenerate the OpenAPI document
        env:
          ConnectionStrings__Default: 'Host=localhost;Port=55433;Database=placeholder;Username=x;Password=y'
          Wolverine__Durable: 'false'
          Admin__ReconcileOnStart: 'false'
        run: dotnet msbuild src/Api -t:"Build;GenerateOpenApiDocuments"

      - name: Regenerate the TypeScript schema
        run: npm run generate:api --prefix frontend

      - name: Fail if either artifact is stale
        run: |
          if ! git diff --exit-code -- openapi/ frontend/src/api/schema.d.ts; then
            echo "::error::The API contract is out of date. Regenerate it with the two commands under 'The API contract' in CLAUDE.md, then commit the result."
            exit 1
          fi

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --prefix frontend

      # eslint runs with --max-warnings 0, so one warning fails this step.
      - run: npm run lint --prefix frontend

      - run: npm run build --prefix frontend

      # --run because `npm test` is bare `vitest`, which otherwise sits in watch mode forever.
      - run: npm test --prefix frontend -- --run

  e2e:
    # Gated behind the fast jobs: e2e is by far the slowest and the most environmentally
    # fragile, and there is nothing to learn from it when the build or the unit tests are red.
    #
    # The job itself lives in e2e.yml so it can also be run by hand (workflow_dispatch) without
    # a second copy of its steps. Called like this, its check shows as "e2e / e2e" - that is the
    # name a branch-protection rule has to require.
    needs: [backend, frontend]
    uses: ./.github/workflows/e2e.yml
